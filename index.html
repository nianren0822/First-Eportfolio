<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nicholas Kraczkowski</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://kit.fontawesome.com/909c67b618.js" crossorigin="anonymous"></script>
</head>
<body>
  <section id="about-me">
    <nav>
      <div class="personal__logo">Nicholas Kraczkowski</div>
      <ul class="nav__link--list">
        <li><a href="" class="
          nav__link--anchor
          link__hover-effect
          link__hover-effect--black
          ">Languages</a>
        </li>
        <li><a href="" class="
          nav__link--anchor
          link__hover-effect
          link__hover-effect--black
          ">Projects</a>
        </li>
        <li><a href="" class="
          nav__link--anchor
          nav__link--anchor-primary
          ">Contact</a>
        </li>
      </ul>
    </nav>
    <div class="flex-1"> 
      <div class="about-me__info row">
      <div class="about-me__info--container">
        <figure class="about-me__picture--mask">
          <img src="" class="about-me__picture" alt="Picture of Me">
        </figure>
        <h1 class="about-me__info--title">
          Hello! I'm <span class="text--purple">Nicholas Kraczkowski</span>
        </h1>
        <p class="about-me__info--para">I'm a <strong class="text--purple">frontend software developer</strong> with a passion for creating web applications of all kinds, to ensure positive user experiences around the globe.</p>
        <div class="about-me__links">
        <a href="" class="about-me__link">
          <i class="fa-brands fa-linkedin-in"></i>
        </a>
        <a href="" class="about-me__link">
          <i class="fa-brands fa-github"></i>
        </a>
        <a href="" class="about-me__link">
          <i class="fa-regular fa-envelope"></i>
        </a>
        <a href="" class="about-me__link">
          <i class="fa-solid fa-file"></i>
        </a>
        </div>
      </div>
      <figure class="about-me__img--container">
        <img src="assets/undraw_mobile-site-builder_qibw.svg" class="about-me__img" alt="developer-pic">
      </figure>
      </div>
    </div>
  </section>
  <section id="languages">
    <div class="container">
      <div class="row">
        <h1 class="section__title">This is my <span class="text--purple">technology stack</span></h1>
        <div class="language__list">
          <div class="language">
            <figure class="language__img--wrapper">
              <img src="https://tse2.mm.bing.net/th/id/OIP.JW3YCbdoyLSL-cBHYXF7YAAAAA?r=0&rs=1&pid=ImgDetMain&o=7&rm=3"
                alt="Html Logo" class="language__img">
            </figure>
          </div>
          <div class="language">
            <figure class="language__img--wrapper">
              <img src="https://static.vecteezy.com/system/resources/previews/066/386/006/non_2x/the-css-logo-icon-free-png.png"
                alt="CSSLogo" class="language__img">
            </figure>
          </div>
          <div class="language">
            <figure class="language__img--wrapper">
              <img src="https://www.freepnglogos.com/uploads/javascript-png/javascript-vector-logo-yellow-png-transparent-javascript-vector-12.png"
                alt="JS Logo" class="language__img">
            </figure>
          </div>
          <div class="language">
            <figure class="language__img--wrapper">
              <img src="https://cdn.iconscout.com/icon/free/png-256/typescript-3521774-2945272.png"
                alt="TypeScript" class="language__img">
            </figure>
          </div>
          <div class="language">
            <figure class="language__img--wrapper">
              <img src="https://cdn.iconscout.com/icon/free/png-256/vue-282497.png"
                alt="VUE LOGO" class="language__img">
            </figure>
          </div>
          <div class="language">
            <figure class="language__img--wrapper">
              <img src="https://cdn.iconscout.com/icon/free/png-256/nuxt-dot-js-3628959-3030184.png"
                alt="NUXT LOGO" class="language__img">
            </figure>
          </div>
          <div class="language">
            <figure class="language__img--wrapper">
              <img src="https://cdn.iconscout.com/icon/free/png-256/react-3-1175109.png"
                alt="REACT LOGO" class="language__img">
            </figure>
          </div>
          <div class="language">
            <figure class="language__img--wrapper">
              <img src="https://mobx.js.org/img/mobx.png"
                alt="MOBX LOGO" class="language__img">
            </figure>
          </div>
        </div>
      </div>
    </div>

</html>
